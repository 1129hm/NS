name: Chatwork Relay

on:
  # 2026-08-05: 自動配信を停止。GitHub ActionsからChatwork APIへのアクセスが
  # 403 Forbiddenで拒否されるようになり(原因未特定)、中継が機能しなくなったため。
  # Cloudflare Worker(ns-chatwork-relay)経由でClaude Routineから直接Chatworkに
  # アクセスする方式に置き換えた。手動実行(workflow_dispatch)のみ残す。
  workflow_dispatch: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Chatwork relay
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_API_TOKEN_1129: ${{ secrets.CHATWORK_API_TOKEN_1129 }}
          CHATWORK_API_TOKEN_KABUNS: ${{ secrets.CHATWORK_API_TOKEN_KABUNS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/chatwork_relay.py
