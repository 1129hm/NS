name: Stock News

on:
  # 2026-07-23: 自動配信を停止。Claude Routine版(kabu-check-*)が同じ内容・同じ時間帯を
  # 担っており、両方が同じChatworkルームに二重送信していたため。手動実行(workflow_dispatch)
  # は残してあるので、必要ならActionsタブから随時実行できる。
  workflow_dispatch: {}

jobs:
  send-stock-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: python stock_news.py
